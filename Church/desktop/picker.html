<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:"><title>選擇分享內容</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:#fff;color:#1f2937;font:14px "Segoe UI","Microsoft JhengHei UI",system-ui,sans-serif;user-select:none;overflow:hidden}
header{-webkit-app-region:drag;display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 8px 0 24px;border-bottom:1px solid #eef0f4}
h1{margin:0;font-size:15px;font-weight:600}
.close{-webkit-app-region:no-drag;width:36px;height:36px;border:0;border-radius:8px;background:none;color:#9ca3af;font-size:18px;cursor:pointer}
.close:hover{background:#f3f4f6;color:#374151}
main{flex:1;overflow-x:hidden;overflow-y:auto;padding:8px 24px 16px;scrollbar-width:thin}
main::-webkit-scrollbar{width:8px}main::-webkit-scrollbar-thumb{background:#e5e7eb;border-radius:4px}
h2{margin:16px 0 10px;font-size:12px;font-weight:600;color:#6b7280;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.source{min-width:0;display:flex;flex-direction:column;gap:8px;padding:6px;border:2px solid transparent;border-radius:12px;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.source:hover{background:#f5f7fb}
.source.selected{border-color:#2563eb;background:#eff4ff}
.source:focus-visible{outline:2px solid #93c5fd;outline-offset:2px}
.thumb{display:flex;align-items:center;justify-content:center;aspect-ratio:16/9;border-radius:8px;background:#f1f3f7;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:contain}
.label{display:flex;align-items:center;gap:6px;min-width:0;padding:0 2px 2px}
.label img{width:16px;height:16px;flex-shrink:0}
.label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:48px 0;text-align:center;color:#9ca3af}
footer{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;border-top:1px solid #eef0f4}
label.audio{display:flex;align-items:center;gap:8px;color:#4b5563;cursor:pointer}
label.audio input{width:16px;height:16px;accent-color:#2563eb}
.actions{display:flex;gap:10px;margin-left:auto}
.btn{min-width:88px;height:36px;padding:0 18px;border-radius:8px;border:1px solid #d1d5db;background:#fff;color:#374151;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{background:#f9fafb}
.btn.primary{border-color:#2563eb;background:#2563eb;color:#fff}
.btn.primary:hover{background:#1d4ed8}
.btn.primary:disabled{opacity:.45;cursor:default}
</style></head>
<body>
<header><h1>選擇要分享的內容</h1><button class="close" id="close" aria-label="取消" title="取消 (Esc)">✕</button></header>
<main id="main"><div class="empty" id="loading">正在讀取可分享的畫面…</div></main>
<footer>
  <label class="audio" id="audio-row" hidden><input id="audio" type="checkbox" checked>分享電腦聲音</label>
  <div class="actions"><button class="btn" id="cancel">取消</button><button class="btn primary" id="share" disabled>分享</button></div>
</footer>
<script src="picker.cjs"></script></body></html>
