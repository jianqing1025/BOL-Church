name = "your-worker-name"
main = "server.ts"
compatibility_date = "2026-04-13"

# 開啟 Workers Logs，例外發生時才有堆疊可查。
[observability]
enabled = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Browser navigations (e.g. clicking a download link) would otherwise get index.html.
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "your-d1-database-name"
database_id = "your-d1-database-id"
migrations_dir = "./migrations"

[[d1_databases]]
binding = "PHOTOS_DB"
database_name = "Church-Photos"
database_id = "your-photos-d1-database-id"
migrations_dir = "./photo-migrations"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "your-r2-bucket-name"

[[r2_buckets]]
binding = "CHURCH_PHOTOS_BUCKET"
bucket_name = "church-photos"

[[kv_namespaces]]
binding = "SNAPSHOT"
id = "your-snapshot-kv-namespace-id"
preview_id = "your-snapshot-kv-preview-id"

[vars]
ADMIN_BOOTSTRAP_EMAIL = "lijianqing@outlook.com"
ADMIN_BOOTSTRAP_NAME = "Owner"
CLOUDFLARE_ZONE_ID = "your-zone-id"
CLOUDFLARE_ACCOUNT_ID = "your-account-id"
CLOUDFLARE_WEB_ANALYTICS_SITE_TAG = "your-web-analytics-site-tag"
CLOUDFLARE_ANALYTICS_API_TOKEN = "your-analytics-read-token"

# Stripe 線上奉獻。secret key 與 webhook secret 請用 `wrangler secret put` 設定。
STRIPE_PUBLISHABLE_KEY = "pk_test_xxx"
STRIPE_FEE_PERCENT = "2.2"
STRIPE_FEE_FIXED_CENTS = "30"

# Live stream probe — UTC SUN 17:00–22:00 every 5 min covers PT SUN 09:00–14:00 year-round.
# Multi-channel upload sync — every 4 hours
[triggers]
crons = ["*/5 17-22 * * SUN", "0 */4 * * *"]

# Meeting v2 secrets (set via `wrangler secret put` in prod, .dev.vars locally):
#   CHAT_PASSWORD, ALLOWED_ORIGIN, LIVEKIT_URL, LIVEKIT_API_KEY, LIVEKIT_API_SECRET

[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]
