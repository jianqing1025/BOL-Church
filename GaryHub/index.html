    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                DEFAULT: '#00f3ff', 
                dark: '#222222',
                light: '#f1f1f1',
                text: '#666666'
              }
            },
            fontFamily: {
              sans: ['Ek Mukta', 'sans-serif'],
              heading: ['Roboto', 'sans-serif'],
              montserrat: ['Montserrat', 'sans-serif'],
              orbitron: ['Orbitron', 'sans-serif'],
              exo: ['"Exo 2"', 'sans-serif'],
            },
            animation: {
              blob: "blob 7s infinite",
              fadeIn: "fadeIn 1.5s ease-in-out"
            },
            keyframes: {
              blob: {
                "0%": { transform: "translate(0px, 0px) scale(1)" },
                "33%": { transform: "translate(30px, -50px) scale(1.1)" },
                "66%": { transform: "translate(-20px, 20px) scale(0.9)" },
                "100%": { transform: "translate(0px, 0px) scale(1)" }
              },
              fadeIn: {
                from: { opacity: 0 },
                to: { opacity: 1 }
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Reset & Global */
      html { scroll-behavior: smooth; }
      body { -webkit-font-smoothing: antialiased; }
      
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* --- GARYLAB.CC LANDING PAGE STYLES --- */
      
      .landing-body {
        font-family: "Exo 2", sans-serif;
        font-weight: 400;
        font-size: 16px;
        line-height: 30px;
        background-color: #0c0f15;
        color: #ababab;
        margin: 0;
      }

      /* Main Layout Container */
      .main-container {
        display: flex;
        align-items: center;
        min-height: 100vh;
        width: 100%;
        transition: all 0.5s ease;
        position: relative;
        overflow: hidden;
      }

      .pt-table {
        width: 100%;
        height: 100vh;
        display: table;
      }

      .pt-tablecell {
        display: table-cell;
        width: 100%;
        vertical-align: middle;
        transition: all 0.5s ease;
      }

      .overlay {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(14, 17, 24, 0.97);
        z-index: 0;
      }

      .site-wrapper {
        height: 100vh;
        overflow: hidden;
      }
      
      /* Title Section Container */
      .title-section {
        margin-bottom: 60px;
        position: relative; 
        width: 100%;
        max-width: 900px;
        margin-left: auto;
        margin-right: auto;
        text-align: center;
        z-index: 10;
      }

      .heading-page {
        text-transform: uppercase;
        font-size: clamp(20px, 3.5vw, 40px);
        font-weight: bolder;
        letter-spacing: 3px;
        color: white;
        font-family: "Orbitron", sans-serif;
        position: relative;
        display: inline-block;
      }

      /* Watermark behind title */
      .title-watermark {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: clamp(50px, 10vw, 120px);
        line-height: 0.7;
        letter-spacing: 8px;
        color: rgba(255, 255, 255, 0.08);
        white-space: nowrap;
        z-index: -1;
        pointer-events: none;
        user-select: none;
        font-weight: 900;
        font-family: "Open Sans", sans-serif;
      }

      /* Hexagon Grid Logic */
      .hex-menu-container {
        width: 720px; /* Standard width for 4-item row */
        margin: 0 auto;
        position: relative;
        z-index: 10;
        padding-left: 4px; /* Optical adjustment */
      }

      /* Clearfix for floated items */
      .hexagon-menu::after {
        content: "";
        display: table;
        clear: both;
      }

      .hexagon-item {
        cursor: pointer;
        width: 200px;
        height: 173.20508px;
        float: left;
        margin-left: -29px; /* Overlap */
        z-index: 0;
        position: relative;
        transform: rotate(30deg);
        transition: all 0.3s ease;
        -webkit-tap-highlight-color: transparent;
      }

      .hexagon-item:first-child {
        margin-left: 0;
      }

      /* Desktop Layout Shift: Moves the last 3 items (5, 6, 7) to the row below, indented */
      /* This creates the honeycomb nesting effect */
      .hexagon-menu .hexagon-item:nth-last-child(1),
      .hexagon-menu .hexagon-item:nth-last-child(2),
      .hexagon-menu .hexagon-item:nth-last-child(3) {
        transform: rotate(30deg) translate(87px, -80px);
      }

      .hexagon-item:hover {
        z-index: 10;
      }

      /* Hex Hover Effects */
      .hexagon-item:hover .hex-item:last-child {
        opacity: 1;
        transform: scale(1.3);
      }
      .hexagon-item:hover .hex-item:first-child {
        opacity: 1;
        transform: scale(1.2);
      }
      .hexagon-item:hover .hex-item:first-child div:before,
      .hexagon-item:hover .hex-item:first-child div:after {
        height: 5px;
      }
      .hexagon-item:hover .hex-item div::before,
      .hexagon-item:hover .hex-item div::after {
        background-color: #00f3ff;
      }
      .hexagon-item:hover .hex-content svg {
        transform: scale(0.97);
      }
      .hexagon-item:hover .icon i {
        color: #00f3ff;
        transition: 0.6s;
      }
      .hexagon-item:hover .title {
        animation: focus-in-contract 0.5s cubic-bezier(0.250, 0.460, 0.450, 0.940) both;
      }

      /* Mobile Responsive adjustments */
      @media only screen and (max-width: 739px) {
        .hex-menu-container {
            width: 720px;
            /* Scale down to fit mobile screen */
            transform: scale(0.45); 
            transform-origin: top center; 
            margin-top: 20px;
            /* Center horizontally despite width being larger than viewport */
            left: 50%;
            margin-left: -360px; 
            margin-bottom: -150px; /* Compensate for empty space after scaling */
        }
        .title-section {
            margin-bottom: 20px;
        }
      }

      /* Tablet */
      @media (min-width: 740px) and (max-width: 1023px) {
        .hex-menu-container {
           transform: scale(0.8); 
           margin-top: 40px;
        }
      }

      @media (min-width: 1024px) {
        .hex-menu-container {
           transform: scale(1.1); 
           margin-top: 50px;
        }
      }

      /* Inner Hex Geometry */
      .hex-item {
        position: absolute;
        top: 0;
        left: 50px;
        width: 100px;
        height: 173.20508px;
      }
      .hex-item:first-child {
        z-index: 0;
        transform: scale(0.92);
        transform-origin: 50% 50%;
        transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
      }
      .hex-item:last-child {
        transition: all 0.3s cubic-bezier(0.19, 1, 0.22, 1);
        z-index: 1;
      }
      .hex-item div {
        box-sizing: border-box;
        position: absolute;
        top: 0;
        width: 100px;
        height: 173.20508px;
        transform-origin: center center;
      }
      .hex-item div::before, .hex-item div::after {
        background-color: #1e2530;
        content: "";
        position: absolute;
        width: 100%;
        height: 3px;
        transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1) 0s;
      }
      .hex-item div:before { top: 0; }
      .hex-item div:after { bottom: 0; }
      .hex-item div:nth-child(1) { transform: rotate(0deg); }
      .hex-item div:nth-child(2) { transform: rotate(60deg); }
      .hex-item div:nth-child(3) { transform: rotate(120deg); }

      /* Content */
      .hex-content {
        color: #fff;
        display: block;
        height: 180px;
        margin: 0 auto;
        position: relative;
        text-align: center;
        transform: rotate(-30deg);
        width: 156px;
      }
      .hex-content .hex-content-inner {
        left: 50%;
        margin: -3px 0 0 2px;
        position: absolute;
        top: 50%;
        transform: translate(-50%, -50%);
      }
      .hex-content .icon {
        display: block;
        font-size: 36px;
        line-height: 30px;
        margin-bottom: 11px;
      }
      .hex-content .title {
        display: block;
        font-family: "Exo 2", sans-serif;
        font-size: 14px;
        letter-spacing: 1px;
        line-height: 24px;
        text-transform: uppercase;
        white-space: nowrap;
        font-weight: 700;
      }
      .hex-content svg {
        left: -8px;
        position: absolute;
        top: -13px;
        transform: scale(0.88);
        z-index: -1;
        transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1) 0s;
      }
      
      /* Custom Icon */
      .icon-church::before {
        content: "\f51d";
        font-family: "Font Awesome 6 Free";
        font-weight: 900;
      }

      @keyframes focus-in-contract {
        0% { letter-spacing: 1em; filter: blur(12px); opacity: 0; }
        100% { filter: blur(0px); opacity: 1; }
      }
    </style>
